<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모던 타이머 애플리케이션</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Pretendard 느낌 -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* 애니메이션 효과 */
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 selection:bg-indigo-500 selection:text-white">

    <!-- 메인 컨테이너 -->
    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl p-6 sm:p-8 flex flex-col items-center relative overflow-hidden">
        
        <!-- 상단 장식용 글로우 효과 -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- 헤더 -->
        <div class="flex items-center justify-between w-full mb-6 z-10">
            <h1 class="text-xl font-bold tracking-tight text-slate-200 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Focus Timer
            </h1>
            <span id="status-badge" class="px-3 py-1 text-xs font-semibold rounded-full bg-slate-800 text-slate-400 border border-slate-700/50 transition-all duration-300">대기 중</span>
        </div>

        <!-- 타이머 디스플레이 영역 (HH:MM:SS) -->
        <div class="relative flex items-center justify-center mb-6 z-10">
            <div id="timer-ring-container" class="w-full py-8 px-6 rounded-3xl border border-slate-800/80 flex flex-col items-center justify-center shadow-inner relative bg-slate-950/40 transition-colors duration-500">
                
                <!-- 시간 텍스트 입력/출력 래퍼 -->
                <div id="display-mode" class="flex flex-col items-center cursor-pointer group" title="클릭하여 직접 시간 설정">
                    <div class="text-4xl sm:text-5xl font-extrabold tracking-tighter text-white font-mono drop-shadow-md" id="time-display">
                        00:05:00
                    </div>
                    <span class="text-xs text-slate-500 mt-2 group-hover:text-indigo-400 transition-colors">클릭하여 시간 수정 (시:분:초)</span>
                </div>

                <!-- 직접 입력 모드 (기본 숨김) -->
                <div id="input-mode" class="hidden flex-col items-center gap-2">
                    <div class="flex items-center gap-1">
                        <input type="number" id="input-hr" min="0" max="23" value="00" class="w-14 bg-slate-800 text-center text-xl font-bold rounded-lg border border-slate-700 focus:outline-none focus:border-indigo-500 py-1 text-white">
                        <span class="text-xl font-bold text-slate-500">:</span>
                        <input type="number" id="input-min" min="0" max="59" value="05" class="w-14 bg-slate-800 text-center text-xl font-bold rounded-lg border border-slate-700 focus:outline-none focus:border-indigo-500 py-1 text-white">
                        <span class="text-xl font-bold text-slate-500">:</span>
                        <input type="number" id="input-sec" min="0" max="59" value="00" class="w-14 bg-slate-800 text-center text-xl font-bold rounded-lg border border-slate-700 focus:outline-none focus:border-indigo-500 py-1 text-white">
                    </div>
                    <div class="flex gap-2 mt-2">
                        <button id="btn-save-time" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-xs font-medium rounded-md transition-colors text-white">확인</button>
                        <button id="btn-cancel-time" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs font-medium rounded-md transition-colors text-slate-300">취소</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- 메모 입력 영역 -->
        <div class="w-full mb-6 z-10">
            <label for="timer-memo" class="block text-xs font-medium text-slate-400 mb-1.5 flex items-center gap-1">
                <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
                타이머 메모 / 할 일
            </label>
            <textarea id="timer-memo" rows="2" placeholder="이 타이머와 관련된 메모를 입력하세요 (자동 저장됨)" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-all resize-none"></textarea>
        </div>

        <!-- 빠른 설정 버튼 그룹 -->
        <div class="grid grid-cols-4 gap-2 w-full mb-6 z-10">
            <button onclick="setTimer(60)" class="quick-btn py-2 px-2 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 hover:border-slate-600 rounded-xl text-xs font-medium text-slate-300 transition-all active:scale-95">1분</button>
            <button onclick="setTimer(300)" class="quick-btn py-2 px-2 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 hover:border-slate-600 rounded-xl text-xs font-medium text-slate-300 transition-all active:scale-95">5분</button>
            <button onclick="setTimer(600)" class="quick-btn py-2 px-2 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 hover:border-slate-600 rounded-xl text-xs font-medium text-slate-300 transition-all active:scale-95">10분</button>
            <button onclick="setTimer(1800)" class="quick-btn py-2 px-2 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 hover:border-slate-600 rounded-xl text-xs font-medium text-slate-300 transition-all active:scale-95">30분</button>
        </div>

        <!-- 메인 컨트롤 버튼 (시작/일시정지/리셋) -->
        <div class="flex items-center gap-3 w-full z-10">
            <button id="btn-start" onclick="toggleTimer()" class="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2">
                <svg id="start-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span id="start-text">시작</span>
            </button>
            <button onclick="resetTimer()" class="px-5 py-3.5 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-300 font-semibold rounded-2xl border border-slate-700/50 transition-all flex items-center justify-center" title="초기화">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
            </button>
        </div>

    </div>

    <!-- 전체 화면 경고 오버레이 (타이머 완료 시 활성화) -->
    <div id="fullscreen-alert-overlay" class="fixed inset-0 bg-rose-950/90 backdrop-blur-2xl hidden flex-col items-center justify-center z-50 p-6 text-center transition-all duration-300">
        <!-- 상단 반짝이는 경고 아이콘 -->
        <div class="w-20 h-20 bg-rose-500/20 text-rose-400 border border-rose-500/40 rounded-full flex items-center justify-center mb-6 text-3xl animate-bounce shadow-lg shadow-rose-500/30">
            🚨
        </div>
        <h2 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight mb-3">타이머 완료!</h2>
        <p class="text-rose-200/80 text-sm sm:text-base mb-8">설정하신 시간이 모두 경과했습니다.</p>

        <!-- 작성했던 메모 출력 영역 -->
        <div class="w-full max-w-lg bg-rose-900/40 border border-rose-500/40 rounded-3xl p-6 sm:p-8 mb-8 shadow-2xl backdrop-blur-md">
            <span class="text-xs font-bold uppercase tracking-widest text-rose-300/70 block mb-2">타이머 메모 / 할 일</span>
            <p id="alert-memo-display" class="text-xl sm:text-2xl font-bold text-white break-words leading-relaxed">
                (작성된 메모가 없습니다)
            </p>
        </div>

        <button onclick="dismissFullscreenAlert()" class="px-8 py-4 bg-white hover:bg-rose-100 active:scale-95 text-rose-950 font-bold rounded-2xl shadow-xl transition-all text-base sm:text-lg">
            경고 및 타이머 해제
        </button>
    </div>

    <!-- 기존 알림 팝업 (미사용 또는 대체됨) -->
    <div id="alert-box" class="hidden"></div>

    <!-- 자바스크립트 로직 -->
    <script>
        let totalSeconds = 300; // 기본 5분 (300초)
        let remainingSeconds = 300;
        let timerId = null;
        let isRunning = false;
        let audioCtx = null;
        let alarmInterval = null; // 알람 반복 재생 인터벌

        const timeDisplay = document.getElementById('time-display');
        const startText = document.getElementById('start-text');
        const startIcon = document.getElementById('start-icon');
        const statusBadge = document.getElementById('status-badge');
        const ringContainer = document.getElementById('timer-ring-container');
        const displayMode = document.getElementById('display-mode');
        const inputMode = document.getElementById('input-mode');
        const inputHr = document.getElementById('input-hr');
        const inputMin = document.getElementById('input-min');
        const inputSec = document.getElementById('input-sec');
        const timerMemo = document.getElementById('timer-memo');
        const fullscreenAlertOverlay = document.getElementById('fullscreen-alert-overlay');
        const alertMemoDisplay = document.getElementById('alert-memo-display');

        // 로컬 스토리지에서 저장된 메모 불러오기
        if (localStorage.getItem('focus_timer_memo')) {
            timerMemo.value = localStorage.getItem('focus_timer_memo');
        }

        timerMemo.addEventListener('input', () => {
            localStorage.setItem('focus_timer_memo', timerMemo.value);
        });

        // 화면 갱신 함수 (HH:MM:SS 형식)
        function updateDisplay() {
            const hours = Math.floor(remainingSeconds / 3600);
            const minutes = Math.floor((remainingSeconds % 3600) / 60);
            const seconds = remainingSeconds % 60;
            
            const formatted = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            timeDisplay.textContent = formatted;
            
            if (isRunning) {
                document.title = `(${formatted}) Focus Timer`;
            } else {
                document.title = '모던 타이머 애플리케이션';
            }
        }

        // 빠른 설정 버튼 클릭 핸들러
        function setTimer(seconds) {
            if (isRunning) pauseTimer();
            totalSeconds = seconds;
            remainingSeconds = seconds;
            updateDisplay();
            updateBadge('대기 중', 'bg-slate-800 text-slate-400 border-slate-700/50');
            ringContainer.classList.remove('border-indigo-500/80', 'animate-pulse-subtle');
        }

        // 타이머 시작/일시정지 토글
        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (remainingSeconds <= 0) return;
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            isRunning = true;
            startText.textContent = '일시정지';
            startIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
            updateBadge('진행 중', 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30');
            ringContainer.classList.add('border-indigo-500/80', 'animate-pulse-subtle');

            timerId = setInterval(() => {
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    updateDisplay();
                }

                if (remainingSeconds <= 0) {
                    clearInterval(timerId);
                    isRunning = false;
                    onTimerComplete();
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerId);
            isRunning = false;
            startText.textContent = '계속';
            startIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
            updateBadge('일시정지', 'bg-amber-500/20 text-amber-400 border-amber-500/30');
            ringContainer.classList.remove('animate-pulse-subtle');
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            remainingSeconds = totalSeconds;
            updateDisplay();
            startText.textContent = '시작';
            startIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
            updateBadge('대기 중', 'bg-slate-800 text-slate-400 border-slate-700/50');
            ringContainer.classList.remove('border-indigo-500/80', 'animate-pulse-subtle');
        }

        function updateBadge(text, classList) {
            statusBadge.textContent = text;
            statusBadge.className = `px-3 py-1 text-xs font-semibold rounded-full border transition-all duration-300 ${classList}`;
        }

        function playAlarmSound() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;
            
            [0, 0.25, 0.5].forEach((delay, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(index === 2 ? 880 : 660, now + delay);

                gain.gain.setValueAtTime(0.3, now + delay);
                gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + delay);
                osc.stop(now + delay + 0.2);
            });
        }

        function onTimerComplete() {
            startText.textContent = '시작';
            startIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
            updateBadge('완료됨', 'bg-rose-500/20 text-rose-400 border-rose-500/30');
            ringContainer.classList.remove('border-indigo-500/80', 'animate-pulse-subtle');
            ringContainer.classList.add('border-rose-500/80');

            // 메모 내용 반영
            const memoText = timerMemo.value.trim();
            alertMemoDisplay.textContent = memoText !== '' ? memoText : '(작성된 메모가 없습니다)';

            // 전체 화면 경고 모드 실행 및 브라우저 Fullscreen 요청 시도
            fullscreenAlertOverlay.classList.remove('hidden');
            fullscreenAlertOverlay.classList.add('flex');
            
            try {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
            } catch (e) {
                // 보안 정책상 실패할 경우 무시
            }

            // 탭 제목 깜빡이기 효과 시작
            let isAltTitle = false;
            titleBlinkInterval = setInterval(() => {
                document.title = isAltTitle ? '🚨 [타이머 완료!] 🚨' : '⏰ 시간이 다 되었습니다!';
                isAltTitle = !isAltTitle;
            }, 800);

            // 화면 배경 플래싱(빨간색/흰색 번갈아 깜빡이기) 효과 시작
            let isFlashRed = true;
            screenFlashInterval = setInterval(() => {
                if (isFlashRed) {
                    fullscreenAlertOverlay.className = "fixed inset-0 bg-red-600/95 backdrop-blur-2xl flex flex-col items-center justify-center z-50 p-6 text-center transition-colors duration-300";
                } else {
                    fullscreenAlertOverlay.className = "fixed inset-0 bg-rose-950/95 backdrop-blur-2xl flex flex-col items-center justify-center z-50 p-6 text-center transition-colors duration-300";
                }
                isFlashRed = !isFlashRed;
            }, 500);

            // 초기 알람음 및 반복 재생 설정 (확인 버튼을 누를 때까지 반복)
            playAlarmSound();
            alarmInterval = setInterval(() => {
                playAlarmSound();
            }, 1500);
        }

        let titleBlinkInterval = null;
        let screenFlashInterval = null;

        function dismissFullscreenAlert() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
            if (titleBlinkInterval) {
                clearInterval(titleBlinkInterval);
                titleBlinkInterval = null;
            }
            if (screenFlashInterval) {
                clearInterval(screenFlashInterval);
                screenFlashInterval = null;
            }
            document.title = '모던 타이머 애플리케이션';

            // 전체 화면 모드 해제 시도
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }

            fullscreenAlertOverlay.classList.remove('flex');
            fullscreenAlertOverlay.classList.add('hidden');
            ringContainer.classList.remove('border-rose-500/80');
            resetTimer();
        }

        displayMode.addEventListener('click', () => {
            if (isRunning) return;
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            
            inputHr.value = String(h).padStart(2, '0');
            inputMin.value = String(m).padStart(2, '0');
            inputSec.value = String(s).padStart(2, '0');

            displayMode.classList.add('hidden');
            inputMode.classList.remove('hidden');
            inputMode.classList.add('flex');
        });

        document.getElementById('btn-cancel-time').addEventListener('click', () => {
            inputMode.classList.remove('flex');
            inputMode.classList.add('hidden');
            displayMode.classList.remove('hidden');
        });

        document.getElementById('btn-save-time').addEventListener('click', () => {
            const h = parseInt(inputHr.value) || 0;
            const m = parseInt(inputMin.value) || 0;
            const s = parseInt(inputSec.value) || 0;
            const newTotal = (h * 3600) + (m * 60) + s;

            if (newTotal > 0) {
                totalSeconds = newTotal;
                remainingSeconds = newTotal;
                updateDisplay();
            }

            inputMode.classList.remove('flex');
            inputMode.classList.add('hidden');
            displayMode.classList.remove('hidden');
        });

        updateDisplay();
    </script>
</body>
</html>
